[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ralup"
version = "0.1.0"
description = "Validated configuration and records for RALUP research"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only AND CC-BY-4.0 AND MIT"
license-files = [
    "LICENSE",
    "licenses/CC-BY-4.0.txt",
    "NOTICE",
    "LICENSING.md",
    "THIRD_PARTY_NOTICES.md",
    "licenses/methods/soap/LICENSE",
]
authors = [{name = "Artem Legotin"}]
dependencies = []

[project.optional-dependencies]
numerics = [
    "torch>=2.6,<3",
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "pyarrow>=19,<27",
    "safetensors>=0.5.2,<0.9",
]
test = ["ralup[numerics]", "pytest>=8,<10"]

[project.scripts]
ralup = "ralup.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "local_evidence: historical byte-authenticated evidence/data; opt in with --local-evidence",
    "native: actual MPS execution; disabled by --cpu-only or RALUP_CPU_TESTS=1",
]
